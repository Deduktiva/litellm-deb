# LiteLLM proxy configuration (/etc/litellm/config.yaml).
# Point api_base at the machine running vLLM. The default assumes vLLM runs on
# this machine; for a remote host (e.g. an NVIDIA DGX Spark over the network),
# edit api_base here, then: sudo systemctl restart litellm
model_list:
  - model_name: qwen
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://127.0.0.1:30000/v1
      api_key: local

litellm_settings:
  drop_params: true
