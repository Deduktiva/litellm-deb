name: litellm-deb

on:
  schedule:
    - cron: "42 18 * * 3"
      timezone: Europe/Vienna
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: apt-repo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      built: ${{ steps.result.outputs.built }}
      version: ${{ steps.resolve.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest litellm on PyPI
        id: resolve
        run: |
          set -euo pipefail
          curl -fsSL https://pypi.org/pypi/litellm/json -o pypi.json
          /usr/bin/python3 -I - pypi.json > resolved.env <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1]))
          version = data["info"]["version"]
          pattern = re.compile(r"^litellm-" + re.escape(version)
                               + r"[-_]cp310-abi3-manylinux_2_28_(aarch64|x86_64)\.whl$")
          found = set()
          for f in data["urls"]:
              if pattern.match(f["filename"]):
                  found.add(f["filename"].rsplit(".", 2)[0].rsplit("_", 1)[1])
          missing = {"aarch64", "x86_64"} - found
          if missing:
              sys.exit(f"litellm {version}: missing manylinux_2_28 wheel(s): {sorted(missing)}")
          print(f"VERSION={version}")
          PY
          cat resolved.env
          cat resolved.env >> "$GITHUB_ENV"
          grep '^VERSION=' resolved.env | sed 's/^VERSION=/version=/' >> "$GITHUB_OUTPUT"
          rm -f pypi.json resolved.env

      - name: Skip if this version is already released
        id: skip
        run: |
          if gh release view "v$VERSION" --json tagName >/dev/null 2>&1; then
            echo "no new litellm, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.skip.outputs.skip == 'false'
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev python3-pip

      # Full dependency closure per architecture, downloaded cross-platform
      # by the native runner pip. This is the only step that needs PyPI.
      - name: Download wheel closures
        if: steps.skip.outputs.skip == 'false'
        run: |
          set -euo pipefail
          build/download-wheels.sh "$VERSION" arm64 build/wheels-arm64
          build/download-wheels.sh "$VERSION" amd64 build/wheels-amd64

      # The venv must be built by Debian 13's python3.13, so both debs are
      # assembled inside debian:trixie containers; the arm64 one runs under
      # qemu (preinstalled on the runner). The install step in the container
      # is --no-index, i.e. offline.
      - name: Build debs in Debian 13 containers
        if: steps.skip.outputs.skip == 'false'
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            [ "$arch" = arm64 ] && platform=linux/arm64 || platform=linux/amd64
            docker run --rm --platform "$platform" \
              -v "$PWD/build:/w:ro" -v "$PWD/dist:/out" \
              -e VERSION="$VERSION" -e ARCH="$arch" \
              debian:trixie bash -c '
                set -euo pipefail
                apt-get update
                apt-get install -y --no-install-recommends python3 python3-venv dpkg-dev
                /w/make-venv.sh "$VERSION" "/w/wheels-${ARCH}" "/tmp/litellm-venv"
                /w/build-deb.sh "$VERSION" "$ARCH" "/tmp/litellm-venv" /out
              '
          done
          echo "$VERSION" > dist/version.txt

      - name: Verify debs
        if: steps.skip.outputs.skip == 'false'
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            deb="dist/litellm_${VERSION}-1_${arch}.deb"
            test "$(dpkg-deb -f "$deb" Architecture)" = "$arch"
            test "$(dpkg-deb -f "$deb" Version)" = "${VERSION}-1"
            test "$(dpkg-deb -f "$deb" Depends)" = "python3, python3.13, systemd"
            contents=$(dpkg-deb --contents "$deb")
            for f in ./DEBIAN/conffiles ./DEBIAN/control ./DEBIAN/postinst \
                     ./DEBIAN/postrm ./DEBIAN/prerm \
                     ./etc/litellm/config.yaml ./etc/litellm/litellm.env \
                     ./lib/systemd/system/litellm.service \
                     ./usr/bin/litellm \
                     ./opt/litellm/venv/bin/litellm \
                     ./opt/litellm/venv/lib/python3.13/site-packages/litellm/__init__.py; do
              echo "$contents" | grep -q " ${f}$" || { echo "missing in $deb: $f"; exit 1; }
            done
            # the shipped venv must be self-contained: no pipx, no pip
            echo "$contents" | grep -q 'pipx' && { echo "pipx trace in $deb"; exit 1; }
            echo "$contents" | grep -q 'venv/bin/pip' && { echo "pip shipped in $deb"; exit 1; }
            n=$(echo "$contents" | wc -l)
            [ "$n" -gt 500 ] || { echo "suspiciously few files in $deb: $n"; exit 1; }
            echo "$deb: $n files, ok"
          done
          tmp=$(mktemp -d)
          dpkg-deb -R "dist/litellm_${VERSION}-1_amd64.deb" "$tmp"
          for s in postinst prerm postrm; do sh -n "$tmp/DEBIAN/$s"; done
          rm -rf "$tmp"

      # End-to-end: install each deb in a fresh Debian 13 container (no
      # network needed for the install itself) and run the entry point.
      - name: Smoke test (dpkg -i in Debian 13)
        if: steps.skip.outputs.skip == 'false'
        run: |
          set -euo pipefail
          for arch in arm64 amd64; do
            [ "$arch" = arm64 ] && platform=linux/arm64 || platform=linux/amd64
            docker run --rm --platform "$platform" \
              -v "$PWD/dist:/d:ro" \
              -e VERSION="$VERSION" -e ARCH="$arch" \
              debian:trixie bash -c '
                set -euo pipefail
                apt-get update
                apt-get install -y --no-install-recommends python3 python3.13 systemd
                dpkg -i "/d/litellm_${VERSION}-1_${ARCH}.deb"
                litellm --version
                dpkg -V litellm
                echo "smoke test ok ($ARCH)"
              '
          done

      - uses: actions/upload-artifact@v7
        if: steps.skip.outputs.skip == 'false'
        with:
          name: debs
          path: |
            dist/*.deb
            dist/version.txt
          if-no-files-found: error

      - name: Result
        id: result
        run: echo "built=${{ steps.skip.outputs.skip == 'false' }}" >> "$GITHUB_OUTPUT"

  release:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: debs
          path: dist
      - name: Create GitHub release
        run: |
          set -euo pipefail
          [ -f dist/version.txt ] || { echo "version.txt missing from artifact"; exit 1; }
          gh release create "v$VERSION" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "litellm $VERSION" \
            --notes "Weekly build from PyPI"

  # apt repo: rebuild dists/ + pool/ from the release and deploy to
  # https://deduktiva.github.io/litellm-deb/. The publish logic (download the
  # release debs, build the signed repo, deploy to Pages) lives in the
  # reusable publish-apt-repo.yml, which can also be dispatched manually to
  # republish an existing version. Runs after release so it always mirrors
  # the release assets.
  apt-repo:
    needs: [build, release]
    if: needs.build.outputs.built == 'true'
    uses: ./.github/workflows/publish-apt-repo.yml
    secrets: inherit
    with:
      version: ${{ needs.build.outputs.version }}
